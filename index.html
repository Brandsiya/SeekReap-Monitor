<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeekReap System Status Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-up {
            background: #d4edda;
            color: #155724;
        }

        .status-down {
            background: #f8d7da;
            color: #721c24;
        }

        .status-degraded {
            background: #fff3cd;
            color: #856404;
        }

        .status-unknown {
            background: #e2e3e5;
            color: #383d41;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .metric-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .refresh-info {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            font-size: 0.8em;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 SeekReap System Status Monitor</h1>
        <div class="subtitle">Real-time health monitoring of all SeekReap tiers</div>

        <div class="status-grid" id="statusGrid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🏗️ Tier-3 Private</span>
                    <span class="status-badge" id="tier3-status">Checking...</span>
                </div>
                <div id="tier3-details">Loading...</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">🎯 Tier-4 Orchestrator</span>
                    <span class="status-badge" id="tier4-status">Checking...</span>
                </div>
                <div id="tier4-details">Loading...</div>
                <div class="metrics-grid" id="tier4-metrics"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">⚙️ Tier-5 Worker Pool</span>
                    <span class="status-badge" id="tier5-status">Checking...</span>
                </div>
                <div id="tier5-details">Loading...</div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh Now</button>
        </div>
        <div class="refresh-info">
            Auto-refreshing every 30 seconds | Last updated: <span id="lastUpdate">Never</span>
        </div>
    </div>

    <script>
        const TIER3_URL = 'https://seekreap-tier-3-dev.fly.dev';
        const TIER4_URL = 'https://seekreap-tier-4-dev.fly.dev';
        const TIER5_URL = 'https://seekreap-tier5-worker.fly.dev';

        async function checkTier3() {
            try {
                const response = await fetch(`${TIER3_URL}/health`);
                const data = await response.json();
                
                document.getElementById('tier3-status').textContent = '🟢 ONLINE';
                document.getElementById('tier3-status').className = 'status-badge status-up';
                
                document.getElementById('tier3-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value">${data.status || 'OK'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tier:</span>
                        <span class="info-value">${data.tier || '3'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Response:</span>
                        <span class="info-value">✅ Healthy</span>
                    </div>
                `;
                return true;
            } catch (error) {
                document.getElementById('tier3-status').textContent = '🔴 OFFLINE';
                document.getElementById('tier3-status').className = 'status-badge status-down';
                document.getElementById('tier3-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Error:</span>
                        <span class="info-value" style="color: red;">${error.message}</span>
                    </div>
                `;
                return false;
            }
        }

        async function checkTier4() {
            try {
                const [health, metrics] = await Promise.all([
                    fetch(`${TIER4_URL}/health`).then(r => r.json()).catch(() => null),
                    fetch(`${TIER4_URL}/api/metrics/latency`).then(r => r.json()).catch(() => null)
                ]);
                
                if (health && health.status === 'ok') {
                    document.getElementById('tier4-status').textContent = '🟢 ONLINE';
                    document.getElementById('tier4-status').className = 'status-badge status-up';
                } else {
                    document.getElementById('tier4-status').textContent = '🟡 DEGRADED';
                    document.getElementById('tier4-status').className = 'status-badge status-degraded';
                }
                
                let metricsHtml = '';
                if (metrics) {
                    metricsHtml = `
                        <div class="metric-box">
                            <div class="metric-label">Queue Depth</div>
                            <div class="metric-value">${metrics.queue_depth || 0}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Failed (24h)</div>
                            <div class="metric-value">${metrics.failed_24h || 0}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Daily Quota</div>
                            <div class="metric-value">${metrics.quota?.daily_limit || 50}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Queue Cap</div>
                            <div class="metric-value">${metrics.quota?.queue_cap || 500}</div>
                        </div>
                    `;
                }
                document.getElementById('tier4-metrics').innerHTML = metricsHtml;
                
                document.getElementById('tier4-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value">${health?.status || 'Unknown'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tier:</span>
                        <span class="info-value">${health?.tier || '4'}</span>
                    </div>
                `;
                return true;
            } catch (error) {
                document.getElementById('tier4-status').textContent = '🔴 OFFLINE';
                document.getElementById('tier4-status').className = 'status-badge status-down';
                document.getElementById('tier4-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Error:</span>
                        <span class="info-value" style="color: red;">${error.message}</span>
                    </div>
                `;
                return false;
            }
        }

        async function checkTier5() {
            try {
                const response = await fetch(`${TIER5_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    document.getElementById('tier5-status').textContent = '🟢 ONLINE';
                    document.getElementById('tier5-status').className = 'status-badge status-up';
                } else {
                    document.getElementById('tier5-status').textContent = '🟡 DEGRADED';
                    document.getElementById('tier5-status').className = 'status-badge status-degraded';
                }
                
                document.getElementById('tier5-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Worker Status:</span>
                        <span class="info-value">${data.worker || 'Unknown'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Health:</span>
                        <span class="info-value">${data.status || 'Unknown'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Response:</span>
                        <span class="info-value">✅ Active</span>
                    </div>
                `;
                return true;
            } catch (error) {
                document.getElementById('tier5-status').textContent = '🔴 OFFLINE';
                document.getElementById('tier5-status').className = 'status-badge status-down';
                document.getElementById('tier5-details').innerHTML = `
                    <div class="info-row">
                        <span class="info-label">Error:</span>
                        <span class="info-value" style="color: red;">${error.message}</span>
                    </div>
                `;
                return false;
            }
        }

        async function refreshAll() {
            document.getElementById('lastUpdate').innerHTML = '<span class="loading"></span> Updating...';
            
            await Promise.all([
                checkTier3(),
                checkTier4(),
                checkTier5()
            ]);
            
            const now = new Date();
            document.getElementById('lastUpdate').innerHTML = now.toLocaleTimeString();
        }

        // Initial load
        refreshAll();
        
        // Auto-refresh every 30 seconds
        setInterval(refreshAll, 30000);
    </script>
</body>
</html>
